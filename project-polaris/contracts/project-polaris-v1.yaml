openapi: 3.1.0
info:
  title: Project Polaris API
  version: 0.1.0
  description: >-
    Contract for authenticated, consent-gated draft-only assistant operations and privacy controls.
servers:
  - url: https://api.example.invalid/api
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200':
          description: Service is running.
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200':
          description: Service is ready for configured dependencies.
  /v1/assistant/capabilities:
    get:
      operationId: listAssistantCapabilities
      security:
        - FirebaseBearer: []
      responses:
        '200':
          description: Enabled draft-only capability metadata.
  /v1/assistant/drafts:
    post:
      operationId: createAssistantDraft
      security:
        - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TaskExtractionRequest'
                - $ref: '#/components/schemas/TaskBreakdownRequest'
      responses:
        '200':
          description: A reviewable draft only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantDraft'
        '400': { $ref: '#/components/responses/SafeError' }
        '401': { $ref: '#/components/responses/SafeError' }
        '403': { $ref: '#/components/responses/SafeError' }
        '429': { $ref: '#/components/responses/SafeError' }
  /v1/assistant/drafts/{draftId}/confirmation:
    post:
      operationId: createAssistantConfirmation
      security:
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Short-lived, action-bound confirmation receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationReceipt'
  /v1/assistant/drafts/{draftId}/approvals:
    post:
      operationId: approveAssistantDraft
      security:
        - FirebaseBearer: []
      parameters:
        - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantApproval'
      responses:
        '200':
          description: Approval receipt for normal local-domain mutation handling.
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase-ID-Token
  parameters:
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    SafeError:
      description: A safe, client-localizable error envelope without user content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SafeError'
  schemas:
    TaskExtractionRequest:
      type: object
      additionalProperties: false
      required: [requestId, workspaceId, capability, assistantResponseLocale, source, consentReceiptVersion, contextFingerprint, clientRequestIdempotencyKey]
      properties:
        requestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        capability: { const: TASK_EXTRACTION }
        assistantResponseLocale: { type: string, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
        source:
          type: object
          additionalProperties: false
          required: [kind, content]
          properties:
            kind: { type: string, enum: [INBOX_ITEM, SELECTED_TEXT] }
            id: { type: string, format: uuid }
            content: { type: string, minLength: 1, maxLength: 12000 }
        consentReceiptVersion: { type: string, maxLength: 128 }
        contextFingerprint: { type: string, maxLength: 256 }
        clientRequestIdempotencyKey: { type: string, format: uuid }
    TaskBreakdownRequest:
      type: object
      additionalProperties: false
      required: [requestId, workspaceId, capability, assistantResponseLocale, sourceTask, consentReceiptVersion, contextFingerprint, clientRequestIdempotencyKey]
      properties:
        requestId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        capability: { const: TASK_BREAKDOWN }
        assistantResponseLocale: { type: string, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$' }
        sourceTask:
          type: object
          additionalProperties: false
          required: [taskId, taskRevision, title]
          properties:
            taskId: { type: string, format: uuid }
            taskRevision: { type: integer, minimum: 0 }
            title: { type: string, minLength: 1, maxLength: 500 }
            notes: { type: string, maxLength: 12000 }
            effortEstimate: { type: string, enum: [TINY, SMALL, MEDIUM, LARGE] }
            dueContext: { type: string, maxLength: 128 }
        consentReceiptVersion: { type: string, maxLength: 128 }
        contextFingerprint: { type: string, maxLength: 256 }
        clientRequestIdempotencyKey: { type: string, format: uuid }
    AssistantDraft:
      type: object
      additionalProperties: false
      required: [draftId, capability, language, summary, uncertainties, learnerQuestions, draftActions, safetyFlags, requiresConfirmation, contextFingerprint, expiresAt]
      properties:
        draftId: { type: string, format: uuid }
        capability: { type: string, enum: [TASK_EXTRACTION, TASK_BREAKDOWN] }
        language: { type: string }
        summary: { type: string }
        uncertainties: { type: array, items: { type: string }, maxItems: 4 }
        learnerQuestions: { type: array, items: { type: string }, maxItems: 3 }
        draftActions:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [candidateId, label, confidence, requiresConfirmation]
            properties:
              candidateId: { type: string, format: uuid }
              label: { type: string, minLength: 1, maxLength: 240 }
              sourceEvidence: { type: string, maxLength: 240 }
              confidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
              requiresConfirmation: { const: true }
        safetyFlags:
          type: array
          items: { type: string }
        requiresConfirmation: { const: true }
        contextFingerprint: { type: string, maxLength: 256 }
        expiresAt: { type: string, format: date-time }
    ConfirmationReceipt:
      type: object
      additionalProperties: false
      required: [receiptId, draftId, capability, contextFingerprint, allowedCandidateIds, expiresAt]
      properties:
        receiptId: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        capability: { type: string, enum: [TASK_EXTRACTION, TASK_BREAKDOWN] }
        contextFingerprint: { type: string, maxLength: 256 }
        allowedCandidateIds: { type: array, items: { type: string, format: uuid } }
        expiresAt: { type: string, format: date-time }
    AssistantApproval:
      type: object
      additionalProperties: false
      required: [receiptId, selectedCandidateIds, contextFingerprint]
      properties:
        receiptId: { type: string, format: uuid }
        selectedCandidateIds:
          type: array
          items: { type: string, format: uuid }
        contextFingerprint: { type: string, maxLength: 256 }
    SafeError:
      type: object
      additionalProperties: false
      required: [code, messageKey, retryable, requestId]
      properties:
        code: { type: string }
        messageKey: { type: string }
        retryable: { type: boolean }
        requestId: { type: string }
